<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <header class="topo">
            <span class="logo"> Meu site</span>
            <nav class="menu">
                <a href="index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html" class="ativo">Contato</a>
            </nav>
        </header>

        <main>
            <section class="conteudo">
                <h1>Contato</h1>
                <p>Preencha o formulário abaixo</p>

                <form class="form" action="#">
                    <div class="campo">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="name" placeholder="Digite seu nome">
                    </div>
                    <div class="campo">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="voce@email.com">
                    </div>
                    <div class="campo">
                        <label for="msg">Mensagem:</label>
                        <textarea name="msg" id="msg" rows="4" placeholder="Digite sua mensagem"></textarea>
                    </div>
                    <button type="submit" class="botao">Enviar</button>
                </form>
            </section>
        </main>

<footer class="rodape">
    <p>-------Trabalho do Enzo-------</p>
</footer>
</body>
</html>
